services:

  n8n:
    image: n8nio/n8n:latest
    container_name: attendahub-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      #- WEBHOOK_URL=https://attendahub-hook.com/
      - TZ=America/Bahia
    volumes:
      - ./n8n_data:/home/node/.n8n
    depends_on:
      - postgres

  wuzapi:
    image: asternic/wuzapi:latest
    container_name: attendahub-wuzapi
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      - WUZAPI_ADMIN_TOKEN=${WUZAPI_ADMIN_TOKEN}
      - TZ=America/Bahia

    volumes:
      - ./wuzapi_data:/app/store

  postgres:
    image: pgvector/pgvector:pg17
    container_name: attendahub-postgres
    restart: unless-stopped

    ports:
    - "5432:5432"

    environment:
      - POSTGRES_DB=chatwoot_production
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=America/Bahia

    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./postgres_init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    container_name: attendahub-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./redis_data:/data