services:

  n8n:
    image: n8nio/n8n:2.22.3
    container_name: attendahub-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - TZ=America/Bahia
    volumes:
      - ./n8n_data:/home/node/.n8n
    depends_on:
      - postgres

  evolution-api:
    image: atendai/evolution-api:v1.8.7
    container_name: attendahub-evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - LOG_LEVEL=info
      - TZ=America/Bahia
    volumes:
      - ./evolution_data:/app/data

  postgres:
    image: postgres:14
    container_name: attendahub-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=chatwoot_production
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=America/Bahia
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: attendahub-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./redis_data:/data

  chatwoot:
    image: chatwoot/chatwoot:latest
    container_name: attendahub-chatwoot
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY_BASE}
      - FRONTEND_URL=http://localhost:3000

      - REDIS_URL=redis://redis:6379

      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=chatwoot_production
      - POSTGRES_USERNAME=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

      - TZ=America/Bahia
    volumes:
      - ./chatwoot_storage:/app/storage

